<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Teste Active JDBC</title>
</head>
<body>
<h1>Lista de Funcionários</h1>

<!-- Exibe a contagem total recebida do backend -->
<p th:text="'Total: ' + ${size}">Total: 0</p>

<table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
    <thead style="background-color: #f1f5f9;">
    <tr>
        <th style="padding: 8px;">ID</th>
        <th style="padding: 8px;">Nome</th>
        <th style="padding: 8px;">CPF</th>
        <th style="padding: 8px;">Função</th>
    </tr>
    </thead>
    <tbody>
    <!-- Loop nos usuários gerando as linhas dinamicamente -->
    <tr th:each="func : ${funcs}">
        <td style="padding: 8px;" th:text="${func.getId()}">1</td>
        <td style="padding: 8px;" th:text="${func.getName()}">João</td>
        <td style="padding: 8px;" th:text="${func.getCpf()}">999</td>
        <td style="padding: 8px;" th:text="${func.getFunção()}">Zelador</td>
    </tr>
    </tbody>
</table>
</body>
</html>
